server {
    listen 80;
    server_name localhost; # Hier später ggf. den internen Uni-Domainnamen eintragen

    # Automatische Umleitung von HTTP auf HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    # Pfade zu den SSL-Zertifikaten im Container
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Sicherheits-Optimierungen für SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        # Weiterleitung an den Python-Container (FastAPI läuft standardmäßig auf Port 8000)
        proxy_pass http://web:8000;
        
        # Wichtige Header für die Python-Anwendung, damit sie die echte Client-IP sieht
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
